<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký lịch khám</title>
    <link rel="stylesheet" href="miniproject.css">
</head>
<body>

    <h1 class="center-text">Đăng ký lịch khám</h1>

    <h4>
        <a href="trangchu.html">Trang chủ</a>
        <a href="dichvu.html"> Dịch vụ</a>
        <a href="dangkylichkham.html"> Đăng kí lịch khám</a>
    </h4>


    <p class="line"></p>

    <form style="text-align:center; margin: 30px 0;">
        
        <label>Họ và tên</label><br>
        <input type="text" placeholder="Nhập họ tên"><br><br>

        <label>Email</label><br>
        <input type="email" placeholder="example@gmail.com"><br><br>

        <label>Số điện thoại</label><br>
        <input type="tel"><br><br>

        <label>Chọn dịch vụ</label><br>
        <select>
            <option>Khám răng tổng quát</option>
            <option>Lấy cao răng</option>
            <option>Tẩy trắng răng</option>
            <option>Niềng răng</option>
        </select><br><br>

        <label>Ngày khám</label><br>
        <input type="date"><br><br>

        <label>Ghi chú thêm</label><br>
        <textarea rows="3" placeholder="Yêu cầu thêm..."></textarea><br><br>

        <button type="submit">Gửi đăng ký</button>
    </form>
    <p class="line2"></p>

</body>
</html>
