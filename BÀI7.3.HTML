<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Nha Sĩ</title>
    <style>
       
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            color: #333;
        }

        
        .dentist-container {
            max-width: 400px; 
        }

        
        .highlight-title {
            color: #f39c12;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .dentist-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            display: block;
            margin-bottom: 15px;
        }


        .dentist-name {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px 0;
            color: #000;
        }

    
        .dentist-specialty {
            color: #27ae60; 
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .dentist-bio {
            font-size: 15px;
            color: #444;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="dentist-container">
        <div class="highlight-title">⭐ NHA SĨ NỔI BẬT</div>

        <img src="https://via.placeholder.com/350x230" alt="BS. Nguyễn Minh Tâm" class="dentist-image">

        <div class="dentist-name">BS. Nguyễn Minh Tâm</div>
        <div class="dentist-specialty">Nha khoa thẩm mỹ</div>
        
        <p class="dentist-bio">
            Hơn 10 năm kinh nghiệm trong lĩnh vực nha khoa thẩm mỹ, giúp hàng ngàn người có một vẻ đẹp hoàn mỹ cho nụ cười.
        </p>
    </div>

</body>
</html>
