<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        .card-container {
            display: flex;          
            gap: 20px;             
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 250px;           
            padding: 10px;          
            border: 1px solid #ccc; 
            border-radius: 5px;     
            text-align: center;     
            font-family: Arial, sans-serif;
        }
        .card h3 {
            color: #007bff;         
            font-size: 18px;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 13px;
            color: #555;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h3>Tẩy trắng răng</h3>
            <p>Công nghệ hiện đại – An toàn – Hiệu quả</p>
        </div>

        <div class="card">
            <h3>Cấy ghép Implant</h3>
            <p>Công nghệ hiện đại – An toàn – Hiệu quả</p>
        </div>

        <div class="card">
            <h3>Khám răng định kỳ</h3>
            <p>Khám răng định kỳ – Để bảo vệ nụ cười của bạn</p>
        </div>
    </div>

</body>
</html>
