<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Assignment - Service Card</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }

        .section-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

      
        .service-card {
           
            width: 350px;
            border: 2px solid #5aff5a;
            border-radius: 10px;
            
            text-align: center;
            padding: 20px;
            margin: 20px 0;
        }

        .service-card h2 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        .service-card p {
            margin: 10px 0 0 0;
            font-size: 14px;
            color: #333;
        }

       
        .evaluation {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="service-card">
        <h2>Tẩy trắng răng</h2>
        <p>Công nghệ hiện đại – An toàn – Hiệu quả</p>
    </div>

    <div class="evaluation">
</body>
</html>
