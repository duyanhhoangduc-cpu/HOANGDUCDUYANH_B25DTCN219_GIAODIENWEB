<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu 6 Món Ăn </title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .menu-grid {
            display: flex;
            flex-wrap: wrap; 
            gap: 15px;      
        }

        .food-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .food-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .food-card img {
            width: 100%;
            height: 220px;
            object-fit: cover; 
        }

        .info {
            padding: 15px;
            text-align: center;
        }

        .name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .price {
            color: #ff4757;
            font-weight: bold;
        }
        .big {
            flex: 0 0 calc(60% - 10px);
        }
        .big img {
            height: 300px;
        }
        .small {
            flex: 0 0 calc(20% - 10px);
        }
        @media (max-width: 1024px) {
            .big, .small {
                flex: 0 0 calc(50% - 8px);
            }
        }

        @media (max-width: 600px) {
            .big, .small {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Thực Đơn Đặc Biệt (6 Món)</h2>

    <div class="menu-grid">
        <div class="food-card big">
            <img src="73a29020f33b585fb0eaed765a2b8950a4aa380f (1).png" alt="Beefsteak">
            <div class="info">
                <div class="name">Bít Tết Bò Mỹ (Big Size)</div>
                <div class="price">450.000 đ</div>
            </div>
        </div>
        <div class="food-card small">
            <img src="73a29020f33b585fb0eaed765a2b8950a4aa380f (1).png" alt="Pizza">
            <div class="info">
                <div class="name">Pizza Hải Sản</div>
                <div class="price">150.000 đ</div>
            </div>
        </div>
        <div class="food-card small">
            <img src="73a29020f33b585fb0eaed765a2b8950a4aa380f (1).png" alt="Salad">
            <div class="info">
                <div class="name">Salad Rau Củ</div>
                <div class="price">85.000 đ</div>
            </div>
        </div>

        <div class="food-card big">
            <img src="73a29020f33b585fb0eaed765a2b8950a4aa380f (1).png" alt="Thịt nướng">
            <div class="info">
                <div class="name">Combo Thịt Nướng Hàn Quốc</div>
                <div class="price">520.000 đ</div>
            </div>
        </div>
        <div class="food-card small">
            <img src="23e6923c8458d3f6f5a5d92b481aed5852e0962b.jpg" alt="Hamburger">
            <div class="info">
                <div class="name">Hamburger Bò</div>
                <div class="price">120.000 đ</div>
            </div>
        </div>
        <div class="food-card small">
            <img src="73a29020f33b585fb0eaed765a2b8950a4aa380f (1).png" alt="Bánh">
            <div class="info">
                <div class="name">Bánh Macaron</div>
                <div class="price">200.000 đ</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
